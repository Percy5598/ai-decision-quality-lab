[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "ai-decision-quality-lab"
version = "0.1.0"
description = "Experimental platform for studying AI-assisted decision-making"
requires-python = ">=3.11"


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
